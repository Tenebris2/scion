services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion
      POSTGRES_DB: scion_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion -d scion_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

  server:
    image: golang:1.25-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - scion-gomod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      - "9810:9810"
    environment:
      SCION_SERVER_DATABASE_DRIVER: postgres
      SCION_SERVER_DATABASE_URL: postgres://scion:scion@postgres:5432/scion_dev?sslmode=disable
    command: >
      sh -c "apk add --no-cache git nodejs npm docker-cli &&
             go run ./cmd/scion server start --foreground --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  scion-gomod-cache:
